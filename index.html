<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>想看清单 · 想玩档案</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂</text></svg>">
<style>
  :root{
    --bg:#101218;
    --layer:#171a23;
    --layer2:#1f2330;
    --layer3:#292e3e;
    --line:rgba(255,255,255,.08);
    --line2:rgba(255,255,255,.17);
    --ink:#eef1f8;
    --ink2:#a5abc0;
    --ink3:#6a7185;
    --accent:#3ed0ac;
    --accent-2:#57b7ff;
    --accent-ink:#07211a;
    --danger:#ff6b6b;
    --radius:14px;
    --font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    --font-num:"Avenir Next","SF Pro Display",-apple-system,"PingFang SC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font-ui);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;
    background-image:radial-gradient(1100px 500px at 90% -10%, rgba(62,208,172,.07), transparent 60%),
                     radial-gradient(900px 480px at -6% 6%, rgba(87,183,255,.05), transparent 55%);
  }
  button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none;padding:0}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
  input::placeholder,textarea::placeholder{color:var(--ink3)}
  .wrap{max-width:1160px;margin:0 auto;padding:0 22px}
  .auth-gate{min-height:100vh;display:grid;place-items:center;padding:24px}
  .auth-card{width:min(100%,390px);padding:34px;background:var(--layer);border:1px solid var(--line2);border-radius:20px;box-shadow:0 24px 60px -28px #000;text-align:center}
  .auth-mark{font-size:36px;margin-bottom:6px}.auth-card h1{margin:0;font-size:23px}.auth-card>p{color:var(--ink2);margin:8px 0 26px}
  .auth-card form{text-align:left}.auth-card label{display:block;font-size:12px;color:var(--ink2);margin-bottom:7px}
  .auth-card input{width:100%;background:var(--layer2);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;outline:none;margin-bottom:13px}
  .auth-card input:focus{border-color:var(--accent)}.auth-card .btn{width:100%;padding:11px}.auth-error{color:#ff9b9b;font-size:12px;margin:12px 0 0!important;text-align:center}

  /* ---------- header ---------- */
  header{padding:22px 0 0}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{width:40px;height:40px;border-radius:12px;flex:none;background:linear-gradient(135deg,var(--accent),#1f9ad6);
    display:grid;place-items:center;font-family:var(--font-num);font-weight:800;font-size:21px;color:#04120f;
    box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 8px 18px -8px rgba(62,208,172,.55)}
  .brand h1{font-size:19px;margin:0;letter-spacing:.02em;font-weight:700}
  .brand .sub{font-size:12px;color:var(--ink3);margin-top:2px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .text-btn{font-size:12px;color:var(--ink2);padding:6px 9px;border-radius:8px}
  .text-btn:hover{background:var(--layer2);color:var(--ink)}
  .sync-state{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3);white-space:nowrap}
  .sync-state::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
  .sync-state.pending{color:#d9b967}.sync-state.saving{color:var(--accent-2)}
  .sync-state.saved{color:var(--accent)}.sync-state.error{color:#ff9b9b}
  .sync-retry{color:#ffb4b4}.sync-retry:hover{color:#fff;background:rgba(255,107,107,.16)}
  .btn-add{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:var(--accent-ink);font-weight:700;
    padding:9px 17px;border-radius:11px;font-size:14px;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 8px 20px -8px rgba(62,208,172,.6);
    transition:background .15s,transform .06s}
  .btn-add:hover{background:#5fe0bf}
  .btn-add:active{transform:translateY(1px)}
  .btn-add .plus{font-size:17px;line-height:1;font-weight:600}

  .ribbon{margin-top:18px;display:flex;flex-wrap:wrap;background:var(--layer);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -22px rgba(0,0,0,.95)}
  .stat{flex:1 1 0;min-width:150px;padding:13px 18px}
  .stat + .stat{border-left:1px solid var(--line)}
  .stat .k{font-size:11px;color:var(--ink3);letter-spacing:.05em}
  .stat .v{font-family:var(--font-num);font-weight:700;font-size:23px;margin-top:2px;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:12px;color:var(--ink3);font-weight:600;margin-left:3px}
  .stat.accent .v{color:var(--accent)}

  /* ---------- toolbar & filters ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 6px}
  .search{background:var(--layer);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:13px;
    min-width:180px;max-width:260px;outline:none;transition:border-color .15s}
  .search:focus{border-color:var(--accent)}
  .fld{position:relative}
  .fld select{appearance:none;-webkit-appearance:none;background:var(--layer);border:1px solid var(--line);color:var(--ink);
    padding:8px 32px 8px 12px;border-radius:10px;font-size:13px;cursor:pointer;outline:none}
  .fld select:focus{border-color:var(--accent)}
  .fld::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;
    border-right:1.5px solid var(--ink2);border-bottom:1.5px solid var(--ink2);
    transform:translateY(-70%) rotate(45deg);pointer-events:none}
  .btn-dir{display:inline-flex;align-items:center;gap:6px;background:var(--layer);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink2)}
  .btn-dir:hover{color:var(--ink);border-color:var(--line2)}
  .chk{display:inline-flex;align-items:center;gap:7px;background:var(--layer);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none;white-space:nowrap}
  .chk:hover{color:var(--ink);border-color:var(--line2)}
  .chk input{accent-color:var(--accent);cursor:pointer;margin:0}
  .chk.on{color:var(--accent)}
  .tool-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .seg{display:flex;gap:3px;background:var(--layer);padding:3px;border-radius:10px;border:1px solid var(--line)}
  .seg button{padding:6px 14px;border-radius:8px;font-size:13px;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
  .seg button.on{background:var(--layer3);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .count-hint{font-size:12px;color:var(--ink3);white-space:nowrap}

  .typebar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
  .chip-t{display:inline-flex;align-items:center;gap:6px;background:var(--layer);border:1px solid var(--line);
    border-radius:999px;padding:5px 13px;font-size:13px;color:var(--ink2);transition:border-color .12s,color .12s,background .12s}
  .chip-t:hover{color:var(--ink);border-color:var(--line2)}
  .chip-t.on{color:#0b1512;border-color:transparent;background:var(--accent);font-weight:600}
  .chip-t .n{font-family:var(--font-num);font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
  .clear-flt{margin-left:auto;font-size:12px;color:var(--ink2);text-decoration:underline;cursor:pointer;padding:6px 8px}
  .clear-flt:hover{color:var(--ink)}

  /* ---------- grid / cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:15px;padding-bottom:70px}
  .card{background:var(--layer);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -22px rgba(0,0,0,.95);
    transition:transform .13s ease,border-color .13s ease}
  .card:hover{transform:translateY(-2px);border-color:var(--line2)}
  .card.armed{border-color:var(--danger)}
  .cover.dz-hovered{outline:2px dashed var(--accent);outline-offset:-3px}
  .cover{position:relative;aspect-ratio:5/3;background:#0a0b10;flex:none;overflow:hidden;display:grid;place-items:center}
  .cover img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;padding:6px}
  .cover .glyph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.92)}
  .cover .glyph span{font-family:var(--font-num);font-weight:800;font-size:56px;letter-spacing:-.02em;
    text-shadow:0 2px 18px rgba(0,0,0,.28)}
  .glyph::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 20% -5%, rgba(255,255,255,.16), transparent 55%);pointer-events:none}
  .cover-top{position:absolute;top:9px;left:9px;z-index:2;display:flex;gap:6px}
  .cover-actions{position:absolute;top:9px;right:9px;z-index:3;display:flex;gap:6px;opacity:0;transition:opacity .12s}
  .card:hover .cover-actions,.card:focus-within .cover-actions{opacity:1}
  .icon-btn{width:29px;height:29px;border-radius:9px;background:rgba(10,11,15,.6);backdrop-filter:blur(4px);
    display:grid;place-items:center;color:#fff;border:1px solid rgba(255,255,255,.2);font-size:14px;line-height:1}
  .icon-btn:hover{background:rgba(10,11,15,.92)}
  .icon-btn.del:hover{background:var(--danger);border-color:var(--danger)}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:2.5px 9px;border-radius:6px;font-size:11px;font-weight:700;
    backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,.28)}
  .b-status{color:#fff;background:rgba(10,11,15,.55);border:1px solid rgba(255,255,255,.2)}
  .b-type{color:rgba(0,0,0,.0)}
  .card-body{padding:11px 13px 12px;display:flex;flex-direction:column;gap:7px;flex:1;min-height:0}
  .c-title{font-size:15px;font-weight:600;margin:0;line-height:1.34;overflow-wrap:anywhere}
  .c-title .author{display:block;font-size:11.5px;font-weight:500;color:var(--ink3);margin-top:2px}
  .c-sub{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-height:18px}
  .chip{font-size:11px;color:var(--ink2);background:var(--layer2);border:1px solid var(--line);padding:1.5px 8px;border-radius:6px}
  .chip.type-ink{font-weight:700}
  .c-note{font-size:12px;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:0}
  .quick{border-top:1px dashed var(--line);margin-top:auto;padding-top:9px;display:flex;gap:8px;align-items:center}
  .qg{flex:1;display:flex;align-items:center;gap:5px;background:var(--layer2);border:1px solid var(--line);border-radius:9px;padding:3px}
  .qg .ql{font-size:10.5px;color:var(--ink3);font-weight:600;padding-left:6px;letter-spacing:.02em}
  .st{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:14px;color:var(--ink2);line-height:1}
  .st:hover{background:var(--layer3);color:var(--ink)}
  .st:disabled{opacity:.25;cursor:not-allowed}
  .qv{flex:1;text-align:center;font-family:var(--font-num);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;cursor:pointer;line-height:1}
  .qv:hover{color:var(--accent)}
  .qv.off{color:var(--ink3);font-weight:600;font-size:12px}
  .qg.rate .qv.on{color:#ffcf5c}
  .qg.pri .qv.on{color:var(--accent)}

  /* ---------- table ---------- */
  .tblwrap{background:var(--layer);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:70px;
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
  table.tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;font-size:12px;color:var(--ink3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
  .tbl th:hover{color:var(--ink)}
  .tbl th .arr{color:var(--accent);margin-left:3px}
  .tbl td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.045);vertical-align:middle}
  .tbl tbody tr:last-child td{border-bottom:none}
  .tbl tbody tr:hover{background:rgba(255,255,255,.022)}
  .t-title{display:flex;align-items:center;gap:10px;font-weight:600}
  .t-cover{width:46px;height:30px;border-radius:6px;overflow:hidden;flex:none;background:#0a0b10;display:grid;place-items:center;position:relative}
  .t-cover img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;padding:1px}
  .t-cover .gly{font-weight:800;font-size:14px}
  .t-title .meta{font-weight:400;color:var(--ink3);font-size:11.5px;margin-left:4px}
  .t-num{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:center}
  .t-num.off{color:var(--ink3)}
  .t-note{color:var(--ink2);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t-ops{display:flex;gap:6px}
  .t-ops button{width:26px;height:26px;border-radius:7px;background:var(--layer2);border:1px solid var(--line);color:var(--ink2);display:grid;place-items:center;font-size:13px}
  .t-ops button:hover{color:var(--ink);background:var(--layer3)}
  .t-ops button.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}
  .empty{padding:70px 20px;text-align:center;color:var(--ink3);background:var(--layer);border:1px dashed var(--line);border-radius:var(--radius);margin-bottom:70px}
  .empty .big{font-size:34px;margin-bottom:10px;opacity:.7}

  /* ---------- type colors ---------- */
  .ty-书 .b-type{color:#fff;background:rgba(202,148,44,.82);border-color:rgba(255,255,255,.18)}
  .ty-动漫 .b-type{color:#fff;background:rgba(139,108,255,.8);border-color:rgba(255,255,255,.18)}
  .ty-电影 .b-type{color:#fff;background:rgba(240,90,124,.82);border-color:rgba(255,255,255,.18)}
  .ty-电视剧 .b-type{color:#fff;background:rgba(71,144,238,.85);border-color:rgba(255,255,255,.18)}
  .ty-游戏 .b-type{color:#0a1f14;background:rgba(106,220,150,.85);border-color:rgba(255,255,255,.18)}
  .ty-纪录片 .b-type{color:#06202a;background:rgba(86,205,224,.85);border-color:rgba(255,255,255,.18)}
  .chip.type-ink{font-weight:600}
  .ty-书 .chip.type-ink{color:#e7b95c}
  .ty-动漫 .chip.type-ink{color:#b39bff}
  .ty-电影 .chip.type-ink{color:#ff9ab4}
  .ty-电视剧 .chip.type-ink{color:#7fc0ff}
  .ty-游戏 .chip.type-ink{color:#7ee6a4}
  .ty-纪录片 .chip.type-ink{color:#7adfec}
  .cov-书{background:linear-gradient(145deg,#cfa254 0%,#8a5b1e 48%,#201503 100%)}
  .cov-动漫{background:linear-gradient(145deg,#aa8dff 0%,#6a45e0 48%,#1a0e3a 100%)}
  .cov-电影{background:linear-gradient(145deg,#ff9db8 0%,#e0446b 48%,#350612 100%)}
  .cov-电视剧{background:linear-gradient(145deg,#81c4ff 0%,#2f7fe0 48%,#071c38 100%)}
  .cov-游戏{background:linear-gradient(145deg,#82eaab 0%,#2cae68 48%,#07250f 100%)}
  .cov-纪录片{background:linear-gradient(145deg,#74dcf0 0%,#2296b6 48%,#06232b 100%)}
  .st-进行中{color:#ffcf6e}
  .st-弃坑{color:#9aa0b5;opacity:.9}
  .qg .ql.star{color:#ffcf5c}

  /* ---------- modal ---------- */
  .mask{position:fixed;inset:0;background:rgba(6,7,10,.66);backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:18px}
  .modal{background:var(--layer);border:1px solid var(--line2);border-radius:18px;width:min(680px,100%);max-height:92vh;overflow:auto;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.8);padding:20px 22px 22px;animation:pop .16s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
  .m-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .m-head h2{font-size:17px;margin:0;font-weight:700;flex:1}
  .x{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);font-size:17px}
  .x:hover{background:var(--layer3);color:var(--ink)}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11.5px;color:var(--ink3);font-weight:600;margin-bottom:5px;letter-spacing:.02em}
  .ipt{width:100%;background:var(--layer2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;transition:border-color .15s}
  .ipt:focus{border-color:var(--accent)}
  textarea.ipt{resize:vertical;min-height:86px;line-height:1.6}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row2 .field{margin-bottom:0}
  .pickrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .pn{flex:none;min-width:38px;height:34px;padding:0 6px;border-radius:9px;background:var(--layer2);border:1px solid var(--line);
    display:grid;place-items:center;font-family:var(--font-num);font-weight:700;font-size:15px;color:var(--ink2);transition:all .12s}
  .pn:hover{border-color:var(--line2);color:var(--ink)}
  .pn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 4px 14px -6px rgba(62,208,172,.6)}
  .pn.rate.on{background:#ffcf5c;color:#3a2600;box-shadow:0 4px 14px -6px rgba(255,207,92,.5)}
  .pn.offbtn{background:transparent;border-style:dashed;color:var(--ink3);min-width:auto;padding:0 10px;font-size:12px;font-weight:600}
  .pn.offbtn:hover{color:var(--ink2)}
  .hint{font-size:11.5px;color:var(--ink3)}
  .plat-row{display:flex;gap:7px;flex-wrap:wrap}
  .pchk{display:inline-flex;gap:6px;align-items:center;background:var(--layer2);border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13px;color:var(--ink2);cursor:pointer}
  .pchk.on{color:var(--ink);border-color:var(--accent);background:rgba(62,208,172,.1)}
  .pchk input{display:none}
  .cust-chip{display:inline-flex;gap:5px;align-items:center;background:rgba(87,183,255,.1);border:1px solid rgba(87,183,255,.3);color:#a8d5ff;border-radius:8px;padding:5px 9px;font-size:13px}
  .cust-chip b{cursor:pointer;color:#9aa0b5;font-weight:600;padding:0 2px}
  .cust-chip b:hover{color:#fff}
  .addplat{display:inline-flex;gap:6px}
  .addplat input{width:110px;background:transparent;border:1px dashed var(--line2);border-radius:8px;padding:5px 9px;font-size:13px;outline:none}
  .addplat input:focus{border-color:var(--accent)}

  /* cover zone */
  .dropzone{position:relative;border:1.5px dashed var(--line2);border-radius:12px;background:var(--layer2);min-height:150px;
    display:grid;place-items:center;overflow:hidden;transition:border-color .15s,background .15s;cursor:pointer}
  .dropzone.hover{border-color:var(--accent);background:rgba(62,208,172,.06)}
  .dropzone.has-cover{border-style:solid;border-color:var(--line)}
  .dropzone img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;padding:8px}
  .dz-empty{text-align:center;color:var(--ink3);padding:22px;pointer-events:none}
  .dz-empty .ic{font-size:26px;margin-bottom:6px}
  .dz-empty .s{font-size:12px;margin-top:4px}
  .dz-del{position:absolute;top:8px;right:8px;z-index:2;background:rgba(10,11,15,.62);color:#fff;border:1px solid rgba(255,255,255,.22);
    border-radius:8px;padding:4px 10px;font-size:12px;display:none;backdrop-filter:blur(4px)}
  .dropzone.has-cover .dz-del{display:block}
  .dz-del:hover{background:var(--danger)}
  .cover-btns{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
  .ghost-btn{background:var(--layer2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:12.5px;color:var(--ink2)}
  .ghost-btn:hover{color:var(--ink);border-color:var(--line2)}
  .urlrow{display:flex;gap:6px;flex:1;min-width:200px}
  .urlrow input{flex:1;min-width:0;background:var(--layer2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12.5px;outline:none}

const COVER_OPTOUT_KEY = LS_KEY + ".optout";
function getCoverOptOut(){
  try { const raw = localStorage.getItem(COVER_OPTOUT_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return [];
}
function addCoverOptOut(title){
  if (!title) return;
  const k = title.trim().toLowerCase();
  const s = getCoverOptOut();
  if (s.indexOf(k) === -1) { s.push(k); try { localStorage.setItem(COVER_OPTOUT_KEY, JSON.stringify(s)); } catch (e) {} }
}
function applyCoverLibrary(){
  if (!Object.keys(COVER_LIBRARY).length) return 0;
  const opt = getCoverOptOut();
  let changed = 0;
  state.items.forEach(it => {
    if (it.cover) return;
    const url = COVER_LIBRARY[it.title.trim()];
    if (!url) return;
    if (opt.indexOf(it.title.trim().toLowerCase()) !== -1) return;
    it.cover = url; it.updated = now(); changed++;
  });
  if (changed) save();
  return changed;
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2, 9)); }
function $$(id){ return document.getElementById(id); }
function toast(msg, isErr){
  const t = document.createElement("div");
  t.className = "toast" + (isErr ? " err" : "");
  t.textContent = msg;
  $$("toasts").appendChild(t);

/* 编号 1=最想先开始：把编号 1..m 平滑映射到优先级 9..1 */
function rankedToPriority(rank, m){
  if (m <= 1) return 9;
  return Math.max(1, Math.round(((m - rank) / (m - 1)) * 8) + 1);
}
function applyRanks(items){
  // items 中带 marker.rank；无 rank 保持 priority
  const ranked = items.filter(x => x.rank > 0);
  const m = ranked.length;
  if (!m) return;
  ranked.sort((a, b) => a.rank - b.rank);
  ranked.forEach((it, idx) => { it.priority = rankedToPriority(idx + 1, m); });
  return;
}

function buildSeeds(){
  const seeds = seedData();
  // 按类别收集带编号项（顺序即编号）
  const numMap = {
    "书": ["牧羊少年奇幻之旅","Nexus（赫拉利新书）","万历十五年","骆驼祥子","平凡的世界","人生的枷锁","杀死一只知更鸟","泰坦：洛克菲勒传","地下室手记"],
    "动漫": ["新世纪福音战士","反叛的鲁路修","CLANNAD","四叠半神话大系","剑风传奇","龙与虎","虫师","葬送的芙莉莲","银河英雄传说","关于地球的运动","攻壳机动队","冰菓"],
    "游戏": ["海猫鸣泣之时","你去死吧（多数表决死亡游戏）","月姬","艾迪芬奇的记忆","杀戮尖塔","魔法少女的魔女审判"],
    "纪录片": ["圆桌派","局部","血之游戏"],
    "电影": ["一一","沙丘"],
    "电视剧": []
  };
  const byKey = {};
  seeds.forEach(it => { byKey[it.type + " " + it.title] = it; });
  Object.keys(numMap).forEach(type => {
    numMap[type].forEach((title, idx) => {
      const it = byKey[type + " " + title];
      if (it) it.rank = idx + 1;
    });
  });
  const groups = {};
  seeds.forEach(it => { (groups[it.type] = groups[it.type] || []).push(it); });
  Object.keys(groups).forEach(type => applyRanks(groups[type]));
  seeds.forEach(it => { delete it.rank; });
  return seeds;
}

function load(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const obj = JSON.parse(raw);
      if (obj && Array.isArray(obj.items)) {
        return obj.items.map(makeItem);
      }
    }
  } catch (e) { console.warn("load failed", e); }
  const seeded = buildSeeds();
  return seeded;
}
function cleanItems(items){
  return items.map(it => {
    const c = Object.assign({}, it);
    // platforms 是唯一会被原地修改的嵌套字段；保存队列需要自己的副本。
    c.platforms = Array.isArray(it.platforms) ? it.platforms.slice() : [];
    delete c._armed; delete c.rank;
    return c;
  });
}
function save(){
  try {
    const clean = cleanItems(state.items);
    localStorage.setItem(LS_KEY, JSON.stringify({ app: "wishlist", ver: 1, updatedAt: now(), items: clean }));
    if (CLOUD_ENABLED && cloudUser) scheduleRemoteSave(clean);
  }
  catch (e) { console.warn("save failed(可能超出存储空间)", e); toast("保存失败：本地存储空间可能已满（封面过大）", true); }
}

function setSyncState(message, kind){
  const stateEl = $$("syncState");
  const retryBtn = $$("syncRetryBtn");
  if (!stateEl || !retryBtn) return;
  stateEl.textContent = message;
  stateEl.className = "sync-state " + (kind || "");
  stateEl.classList.toggle("hidden", !message);
  retryBtn.classList.toggle("hidden", kind !== "error");
}
function syncClock(){
  return new Intl.DateTimeFormat("zh-CN", { hour: "2-digit", minute: "2-digit" }).format(new Date());
}
function scheduleRemoteSave(items){
  clearTimeout(remoteSaveTimer);
  // 只保留最新快照；由 flushRemoteSave 串行发送，避免慢请求反向覆盖新修改。
  queuedRemoteSnapshot = { app: "wishlist", ver: 1, updatedAt: now(), items: cleanItems(items), optout: getCoverOptOut().slice() };
  failedRemoteSnapshot = null;
  setSyncState("等待同步", "pending");
  remoteSaveTimer = setTimeout(flushRemoteSave, 400);
}
async function flushRemoteSave(){
  remoteSaveTimer = null;
  if (remoteSaveInFlight || !queuedRemoteSnapshot || !supabaseClient || !cloudUser) return;
  const snapshot = queuedRemoteSnapshot;
  queuedRemoteSnapshot = null;
  remoteSaveInFlight = true;
  setSyncState("正在同步", "saving");
  try {
    const { error } = await supabaseClient.from("wishlist_data").upsert(
      { user_id: cloudUser.id, data: snapshot, updated_at: new Date().toISOString() },
      { onConflict: "user_id" }
    );
    if (error) throw error;
    setSyncState("已同步 " + syncClock(), "saved");
  } catch (error) {
    console.warn("cloud save failed", error);
    // 如果期间又有新修改，新快照已经包含之前的修改，继续发送它即可。
    if (queuedRemoteSnapshot) setSyncState("正在同步新修改", "saving");
    else {
      failedRemoteSnapshot = snapshot;
      setSyncState("同步失败", "error");
      toast("云端保存失败；修改已保存在本机，可点击“重试同步”", true);
    }
  } finally {
    remoteSaveInFlight = false;
    if (queuedRemoteSnapshot && !remoteSaveTimer) flushRemoteSave();
  }
}
function retryRemoteSave(){
  if (!failedRemoteSnapshot) return;
  queuedRemoteSnapshot = failedRemoteSnapshot;
  failedRemoteSnapshot = null;
  setSyncState("正在重试", "saving");
  flushRemoteSave();
}
async function loadCloudData(){
  const { data, error } = await supabaseClient.from("wishlist_data").select("data").eq("user_id", cloudUser.id).maybeSingle();
  if (error) throw error;
  const doc = data && data.data;
  state.items = doc && Array.isArray(doc.items) ? doc.items.map(makeItem) : [];
  if (doc && Array.isArray(doc.optout)) localStorage.setItem(COVER_OPTOUT_KEY, JSON.stringify(doc.optout));
}

let state = { items: CLOUD_ENABLED ? [] : load(), filter: { q: "", status: "all", type: "all", hideDone: false, sortF: "p", sortDir: "desc", view: "grid" } };

/* ============================== 筛选 / 排序 ============================== */
function matchQ(it){
  const q = state.filter.q.trim().toLowerCase();
  if (!q) return true;
  const hay = [it.title, it.author, it.lang, it.note, it.status,
               (STATUS[it.status] || {}).label || "", it.type,
               (it.platforms || []).join(" ")].join(" ").toLowerCase();
  return hay.includes(q);
}
function filtered(){
  const f = state.filter;
  return state.items.filter(it =>
    matchQ(it) &&
    (f.status === "all" || it.status === f.status) &&
    (f.type === "all" || it.type === f.type) &&
    (f.status !== "all" || !f.hideDone || it.status === "want" || it.status === "doing")
  );
}
function sorted(arr){
  const f = state.filter;
  const arr2 = arr.slice();
  const dir = f.sortDir === "asc" ? 1 : -1;
  const nameCmp = (a, b) => a.title.localeCompare(b.title, "zh-Hans-CN", { numeric: true }) ||
                            String(a.id).localeCompare(String(b.id));
  let prim;
  switch (f.sortF) {
    case "p": prim = (a, b) => (a.priority - b.priority) || (b.rating - a.rating) || nameCmp(a, b); break;
    case "r": prim = (a, b) => (a.rating - b.rating) || (b.priority - a.priority) || nameCmp(a, b); break;
    case "status": prim = (a, b) => (String(a.status).localeCompare(String(b.status))) || nameCmp(a, b); break;
    case "type": prim = (a, b) => (typeIndex(a.type) - typeIndex(b.type)) || (b.priority - a.priority) || nameCmp(a, b); break;
    case "updated": prim = (a, b) => (a.updated - b.updated); break;
    default: prim = nameCmp;
  }
  arr2.sort((a, b) => { const c = prim(a, b); return c === 0 ? nameCmp(a, b) : dir * c; });
  return arr2;
}
function typeIndex(t){
  const i = TYPE_ORDER.indexOf(t);
  return i === -1 ? 99 : i;
}

}

function setSortField(field){

  else { f.sortF = field; f.sortDir = (field === "name" || field === "updated") ? "desc" : "desc"; }
  if (field === "name") f.sortDir = "asc";
  refresh();

/* ============================== 动作：增删改/步进 ============================== */
function getItem(id){ return state.items.find(x => x.id === id); }
function mutate(id, fn){
  const it = getItem(id);
  if (!it) return;
  fn(it);
  it.updated = now();
  save(); refresh();
}
function setPri(id, delta){
  mutate(id, it => { it.priority = Math.max(0, Math.min(9, it.priority + delta)); });
}
function setRate(id, delta){
  mutate(id, it => { it.rating = Math.max(0, Math.min(9, it.rating + delta)); });
}
function removeItem(id, name){
  state.items = state.items.filter(x => x.id !== id);
  save(); refresh();
  toast(name ? "已删除：" + name : "已删除");
}

/* ============================== 封面：上传/拖拽/粘贴/网址 ============================== */
const THUMB_MAX = 360;          // 封面缩略图最长边(px)：卡片约250px宽，足够看清
const THUMB_QUALITY = 0.8;      // JPEG 压缩质量
const THUMB_DATA_LEN = 50000;   // dataURL 封面超过此字符数即视为大图，启动时自动压成缩略图
function loadImageEl(src){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error("image load failed"));
    img.src = src;
  });
}
function readAsDataURL(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function compressImg(img, maxSide, quality){
  const m = maxSide || THUMB_MAX;
  const q = quality || THUMB_QUALITY;
  let w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) return null;
  const sc = Math.min(1, m / Math.max(w, h));
  w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const x = c.getContext("2d");
  x.drawImage(img, 0, 0, w, h);
  return c.toDataURL("image/jpeg", q);
}
async function fileToCover(file){
  try {
    const url = await readAsDataURL(file);
    try { const img = await loadImageEl(url); const out = compressImg(img); if (out) return out; } catch (e) {}
    return url;
  } catch (e) { return null; }
}
async function urlToCover(urlStr){
  const u = urlStr.trim();
  if (!u) return;
  try {
    const res = await fetch(u, { mode: "cors" });
    if (!res.ok) throw new Error("http " + res.status);
    const blob = await res.blob();
    const tmp = URL.createObjectURL(blob);
    try {
      const img = await loadImageEl(tmp);
      const out = compressImg(img);
      URL.revokeObjectURL(tmp);
      if (out) { draft.cover = out; refreshCoverPreview(); toast("封面已载入"); return; }
    } catch (e) { URL.revokeObjectURL(tmp); }
  } catch (e) {
    // 直接当作链接封面使用
    draft.cover = u; refreshCoverPreview();
    toast("无法下载该图，已直接使用链接（需联网显示）");
    return;
  }
}
/* 把存成 dataURL 的大封面自动压成缩略图（打开页面时跑一次，幂等：小图不处理） */
async function migrateCoversToThumb(){
  let changed = 0, savedChars = 0;
  for (const it of state.items) {
    if (!it.cover || it.cover.indexOf("data:") !== 0) continue;   // 链接封面不动
    if (it.cover.length < THUMB_DATA_LEN) continue;               // 已是小图就跳过
    try {
      const img = await loadImageEl(it.cover);
      const out = compressImg(img);
      if (out && out.length < it.cover.length) {
        savedChars += it.cover.length - out.length;
        it.cover = out; it.updated = now(); changed++;
      }
    } catch (e) { /* 单张失败不影响其它 */ }
  }
  if (changed) save();
  return { changed, kb: Math.round(savedChars * 0.75 / 1024) };
}
function refreshCoverPreview(){
  const dz = $$("coverDrop");
  const has = !!draft.cover;
  dz.classList.toggle("has-cover", has);
  if (has) {
    dz.innerHTML = `<img src="${esc(draft.cover)}" alt="封面"><button class="dz-del" data-act="coverdel" type="button">移除封面</button>`;
  } else {
    dz.innerHTML = `<div class="dz-empty"><div class="ic">🖼</div>点按选择 / 拖图进来 / 粘贴图片<div class="s">也可以填一个图片网址</div></div>`;
  }
}
function setCoverValue(v){
  if (!v && editId && draft && draft.title) addCoverOptOut(draft.title); // 用户主动移除封面 → 记住不再自动补
  draft.cover = v || "";

}

/* 拖拽（弹窗 & 卡片） */
function bindDnD(){
  const dz = $$("coverDrop");
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  dz.addEventListener("click", e => {
    if (e.target.closest(".dz-del")) { setCoverValue(""); return; }
    $$("coverFile").click();
  });
  dz.addEventListener("dragover", e => { stop(e); dz.classList.add("hover"); });
  dz.addEventListener("dragleave", () => dz.classList.remove("hover"));
  dz.addEventListener("drop", e => {
    stop(e); dz.classList.remove("hover");
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && f.type && f.type.indexOf("image") === 0) {
      fileToCover(f).then(v => { if (v) { setCoverValue(v); toast("封面已添加"); } });
    } else toast("请拖入图片文件", true);
  });
  $$("coverFile").addEventListener("change", () => {
    const f = $$("coverFile").files && $$("coverFile").files[0];
    if (f) fileToCover(f).then(v => { if (v) { setCoverValue(v); toast("封面已添加"); } });
    $$("coverFile").value = "";
  });
  // 列表卡片整卡拖放（delegated）
  $$("list").addEventListener("dragover", e => {
    const card = e.target.closest("[data-drop]");
    if (!card) return;
    e.preventDefault();
    card.classList.add("dz-hovered");
  });
  $$("list").addEventListener("dragleave", e => {
    const card = e.target.closest("[data-drop]");
    if (card) card.classList.remove("dz-hovered");
  });
  $$("list").addEventListener("drop", e => {
    const card = e.target.closest("[data-drop]");
    if (!card) return;
    e.preventDefault();
    card.classList.remove("dz-hovered");
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && f.type && f.type.indexOf("image") === 0) {
      const id = card.dataset.drop;
      fileToCover(f).then(v => {
        if (!v) return;
        mutate(id, it => { it.cover = v; });
        toast("封面已更新");
      });
    }
  });
  // 全局粘贴图片
  document.addEventListener("paste", e => {
    const cd = e.clipboardData;
    if (!cd) return;
    const imgItem = Array.from(cd.items || []).find(i => i.type && i.type.indexOf("image") === 0);
    if (!imgItem) return;
    if (!$$("mask").classList.contains("hidden")) {
      e.preventDefault();
      const f = imgItem.getAsFile();
      if (f) fileToCover(f).then(v => { if (v) { setCoverValue(v); toast("已粘贴封面"); } });
    } else {
      // 没有打开编辑框时忽略图片粘贴
      toast("提示：先打开某条的「编辑」，再把图片粘贴进去设封面");
    }
  });
}

/* ============================== 导出 / 导入 ============================== */
function buildExport(){
  return JSON.stringify({ app: "wishlist", ver: 1, exportedAt: new Date().toISOString(), items: state.items }, null, 2);
}
function doExport(){
  const blob = new Blob([buildExport()], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "想看清单备份-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("已导出备份文件");
}
function doImportFile(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const obj = JSON.parse(r.result);
      const arr = obj && Array.isArray(obj.items) ? obj.items : obj;
      if (!Array.isArray(arr)) throw new Error("bad");
      let added = 0, updated = 0;
      arr.forEach(o => {
        const t = String(o.title || "").trim();
        if (!t) return;
        const type = o.type || "";
        const dupItem = state.items.find(x => x.type === type && x.title.trim().toLowerCase() === t.toLowerCase());
        if (dupItem) {
          let touched = false;
          if (!dupItem.cover && o.cover) { dupItem.cover = o.cover; touched = true; }
          if (!dupItem.author && o.author) { dupItem.author = o.author; touched = true; }
          if (!dupItem.lang && o.lang) { dupItem.lang = o.lang; touched = true; }
          if (!dupItem.note && o.note) { dupItem.note = o.note; touched = true; }
          if (touched) { dupItem.updated = now(); updated++; }
          return;
        }
        state.items.push(makeItem(o));
        added++;
      });
      save(); refresh();
      const bits = [];
      if (added) bits.push("新增 " + added + " 条");
      if (updated) bits.push("补全封面/信息 " + updated + " 条");
      toast("导入完成：" + (bits.length ? bits.join("，") : "没有需要更新的内容"));
    } catch (e) { toast("导入失败：文件格式不对", true); }
  };
  r.readAsText(file);
}

/* ============================== 事件绑定 ============================== */
function bindEvents(){
  $$("syncRetryBtn").addEventListener("click", retryRemoteSave);
  window.addEventListener("online", () => {
    if (failedRemoteSnapshot) retryRemoteSave();
    else if (queuedRemoteSnapshot && !remoteSaveInFlight) flushRemoteSave();
  });
  // 切到后台时立刻发起已排队的保存，降低刚编辑完就关闭页面而漏存的概率。
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && queuedRemoteSnapshot && !remoteSaveInFlight) flushRemoteSave();
  });
  // 搜索
  let tmr = null;
  $$("q").addEventListener("input", e => {
    state.filter.q = e.target.value;
    clearTimeout(tmr);
    tmr = setTimeout(() => { renderTypebar(); syncControls(); renderList(); }, 60);
  });
  // 状态 / 排序
  $$("statusSel").addEventListener("change", e => { state.filter.status = e.target.value; refresh(); });
  // “只显示未看完”：隐藏 已完成/弃坑
  $$("hideDoneChk").addEventListener("change", e => {
    state.filter.hideDone = e.target.checked;
    if (e.target.checked && (state.filter.status === "done" || state.filter.status === "dropped")) {
      state.filter.status = "all"; // 和状态筛选冲突时，回到全部再隐藏
    }
    refresh();
  });
  $$("sortSel").addEventListener("change", e => {
    const f = state.filter;
    if (f.sortF === e.target.value) return;
    f.sortF = e.target.value;
    if (f.sortF === "name") f.sortDir = "asc"; else f.sortDir = "desc";
    refresh();
  });
  // 表格表头点击排序
  $$("list").addEventListener("click", e => {
    const th = e.target.closest("th[data-sort]");
    if (th) { setSortField(th.dataset.sort); }
  });
  // 全局 action 委托
  document.addEventListener("click", e => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.dataset.act;
    const i = btn.dataset.i;
    switch (act) {
      case "new": openAdd(); break;
      case "view": state.filter.view = btn.dataset.v; refresh(); break;
      case "sortdir": state.filter.sortDir = state.filter.sortDir === "asc" ? "desc" : "asc"; refresh(); break;
      case "settype": state.filter.type = btn.dataset.v; refresh(); break;
      case "clearflt": state.filter.q = ""; state.filter.status = "all"; state.filter.type = "all"; state.filter.hideDone = false; refresh(); break;
      case "edit": if (i) openEdit(i); break;
      case "del": if (i) openDeleteConfirm(i); break;
      case "delno": closeDeleteConfirm(); break;
      case "delyes": doConfirmedDelete(); break;
      case "priU": if (i) setPri(i, 1); break;
      case "priD": if (i) setPri(i, -1); break;
      case "rateU": if (i) setRate(i, 1); break;
      case "rateD": if (i) setRate(i, -1); break;
      case "mclose": closeModal(); break;
      case "mdel": if (editId) openDeleteConfirm(editId); break;
      case "msave": saveModal(); break;
      case "coverdel": setCoverValue(""); break;
      case "coverpick": $$("coverFile").click(); break;
      case "coverpaste": toast("请复制图片后在页面内按 ⌘V / Ctrl+V 粘贴"); break;
      case "coverurl": urlToCover($$("coverUrl").value); break;
      case "export": doExport(); break;
      case "import": $$("importFile").click(); break;
    }
  });
  $$("importFile").addEventListener("change", () => {
    const f = $$("importFile").files && $$("importFile").files[0];
    if (f) doImportFile(f);
    $$("importFile").value = "";
  });
  // 遮罩点击关闭
  $$("mask").addEventListener("mousedown", e => { if (e.target === $$("mask")) closeModal(); });
  $$("confirmWrap").addEventListener("mousedown", e => { if (e.target === $$("confirmWrap")) closeDeleteConfirm(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { if (!$$("confirmWrap").classList.contains("hidden")) closeDeleteConfirm(); else closeModal(); }
  });

  // 类型下拉（含自定义）
  $$("fType").addEventListener("change", e => {
    if (!draft) return;
    draft.type = e.target.value;
    updateTypeUI();
  });
  $$("fCustomType").addEventListener("input", e => { draft.customType = e.target.value; });
}

/* ============================== 测试钩子 ============================== */
window.__app = {
  get state(){ return state; },
  getView: () => state.filter.view,
  filtered, sorted,
  items: () => state.items.slice(),
  find: getItem,
  openAdd, openEdit, saveModal, removeItem, openDeleteConfirm, closeDeleteConfirm, doConfirmedDelete,
  setType: v => { state.filter.type = v; refresh(); },
  setStatus: v => { state.filter.status = v; refresh(); },
  setQ: v => { state.filter.q = v; refresh(); },
  setSort: (f, d) => { state.filter.sortF = f; state.filter.sortDir = d || state.filter.sortDir; refresh(); },
  addRaw: o => { state.items.unshift(makeItem(o)); save(); refresh(); return state.items[0]; },
  setCover: setCoverValue,
  exportJSON: buildExport,
  refresh
};

/* ============================== 启动 ============================== */
function init(){
  if (!CLOUD_ENABLED && !state.items.length) {
    const seeded = buildSeeds();
    if (seeded.length) { state.items = seeded; save(); }
  }
  const libAdded = applyCoverLibrary();
  if (libAdded) console.log("cover library: 已自动补齐 " + libAdded + " 个封面");
  renderStats();
  renderTypebar();
  syncControls();
  renderList();
  bindEvents();
  bindDnD();
  // 自动把已存的大封面压成缩略图
  migrateCoversToThumb().then(r => {
    if (r.changed) { refresh(); toast("已将 " + r.changed + " 张封面压成缩略图（省约 " + r.kb + " KB）"); }
  });
}
function showLoginError(message){
  const el = $$("loginError");
  el.textContent = message;
  el.classList.remove("hidden");
}
function showApp(){
  $$("authGate").classList.add("hidden");
  $$("appShell").classList.remove("hidden");
  $$("syncPlace").textContent = CLOUD_ENABLED ? "云端同步" : "本机浏览器";
  $$("storagePlace").textContent = CLOUD_ENABLED ? "云端（换设备登录也能继续使用）" : "本机浏览器";
  setSyncState(CLOUD_ENABLED ? "已从云端读取" : "仅保存在本机", CLOUD_ENABLED ? "saved" : "");
  $$("signOutBtn").classList.toggle("hidden", !CLOUD_ENABLED || PUBLIC_MODE);
}
async function enterCloudApp(){
  try {
    await loadCloudData();
    showApp();
    init();
  } catch (e) {
    console.error("cloud load failed", e);
    showLoginError("无法读取云端数据，请检查网络或 Supabase 设置。");
  }
}
async function boot(){
  if (!CLOUD_ENABLED) {
    showApp();
    init();
    return;
  }
  if (!window.supabase) {
    $$("authGate").classList.remove("hidden");
    showLoginError("登录组件未能加载，请检查网络后刷新。");
    return;
  }
  supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.publishableKey);
  if (PUBLIC_MODE) {
    // 公开模式不创建登录会话：数据库策略只允许访问下面这个指定的文档。
    cloudUser = { id: SUPABASE_CONFIG.publicDocumentUserId };
    enterCloudApp();
    return;
  }
  $$("signOutBtn").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    cloudUser = null;
    location.reload();
  });
  $$("authGate").classList.remove("hidden");
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session && session.user) { cloudUser = session.user; enterCloudApp(); return; }
  $$("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $$("loginBtn");
    btn.disabled = true; btn.textContent = "正在进入…";
    $$("loginError").classList.add("hidden");
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: SUPABASE_CONFIG.accountEmail,
      password: $$("accessPassword").value
    });
    btn.disabled = false; btn.textContent = "进入清单";
    if (error || !data.user) { showLoginError("密码不正确，或暂时无法连接。请重试。"); return; }
    cloudUser = data.user;
    enterCloudApp();
  });
}
document.addEventListener("DOMContentLoaded", boot);
window.addEventListener("load", () => {
  console.log("wishlist ready, cloud =", CLOUD_ENABLED, "items =", state.items.length);
});
